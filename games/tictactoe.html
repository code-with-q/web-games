<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>Neon Tic-Tac-Toe</title>
<style>
  :root {
    --bg-dark: #0a0a1a;
    --bg-card: #1a1a2e;
    --bg-cell: #16213e;
    --neon-cyan: #00ffff;
    --neon-magenta: #ff00ff;
    --neon-green: #00ff00;
    --neon-blue: #0080ff;
    --text-light: #e0e0e0;
    --text-muted: #888;
    --shadow-cyan: 0 0 10px rgba(0, 255, 255, 0.5), 0 0 20px rgba(0, 255, 255, 0.3);
    --shadow-magenta: 0 0 10px rgba(255, 0, 255, 0.5), 0 0 20px rgba(255, 0, 255, 0.3);
    --shadow-green: 0 0 10px rgba(0, 255, 0, 0.5), 0 0 20px rgba(0, 255, 0, 0.3);
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg-dark);
    color: var(--text-light);
    -webkit-font-smoothing: antialiased;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
    background: radial-gradient(ellipse at center, #1a1a2e 0%, #0a0a1a 100%);
  }

  .app {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }

  header {
    text-align: center;
  }

  h1 {
    margin: 0;
    font-size: clamp(1.8rem, 6vw, 2.4rem);
    font-weight: 700;
    color: var(--neon-cyan);
    text-shadow: 0 0 10px rgba(0, 255, 255, 0.8), 0 0 20px rgba(0, 255, 255, 0.4);
    letter-spacing: 2px;
  }

  .subtitle {
    margin: 6px 0 0;
    color: var(--text-muted);
    font-size: 0.85rem;
  }

  .mode-selector {
    display: flex;
    gap: 10px;
    width: 100%;
  }

  .mode-btn {
    flex: 1;
    padding: 12px 16px;
    border: 2px solid var(--neon-blue);
    border-radius: 10px;
    background: transparent;
    color: var(--text-light);
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 0 8px rgba(0, 128, 255, 0.3);
  }

  .mode-btn:hover {
    background: rgba(0, 128, 255, 0.1);
    box-shadow: 0 0 12px rgba(0, 128, 255, 0.5);
  }

  .mode-btn.active {
    background: var(--neon-blue);
    color: #fff;
    box-shadow: var(--shadow-cyan);
  }

  .status {
    width: 100%;
    text-align: center;
    padding: 14px 18px;
    background: var(--bg-card);
    border: 2px solid var(--neon-blue);
    border-radius: 12px;
    font-size: 1.05rem;
    font-weight: 600;
    color: var(--text-light);
    box-shadow: 0 0 15px rgba(0, 128, 255, 0.3);
    transition: all 0.3s ease;
    min-height: 52px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .status.win {
    border-color: var(--neon-green);
    color: var(--neon-green);
    box-shadow: var(--shadow-green);
  }

  .status.lose {
    border-color: var(--neon-magenta);
    color: var(--neon-magenta);
    box-shadow: var(--shadow-magenta);
  }

  .status.draw {
    border-color: var(--neon-cyan);
    color: var(--neon-cyan);
    box-shadow: var(--shadow-cyan);
  }

  .board {
    width: 100%;
    aspect-ratio: 1 / 1;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    gap: 10px;
    padding: 14px;
    background: var(--bg-card);
    border: 2px solid var(--neon-blue);
    border-radius: 16px;
    box-shadow: 0 0 20px rgba(0, 128, 255, 0.3);
  }

  .cell {
    position: relative;
    background: var(--bg-cell);
    border: 2px solid rgba(0, 128, 255, 0.3);
    border-radius: 12px;
    font-size: clamp(2.5rem, 10vw, 3.8rem);
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
    user-select: none;
    outline: none;
    -webkit-user-select: none;
  }

  .cell:hover:not(:disabled) {
    background: rgba(0, 128, 255, 0.1);
    border-color: var(--neon-blue);
    box-shadow: 0 0 15px rgba(0, 128, 255, 0.4);
    transform: scale(1.02);
  }

  .cell:active:not(:disabled) {
    transform: scale(0.97);
  }

  .cell:disabled {
    cursor: default;
  }

  .cell.x {
    color: var(--neon-cyan);
    text-shadow: 0 0 10px rgba(0, 255, 255, 0.8), 0 0 20px rgba(0, 255, 255, 0.4);
    border-color: var(--neon-cyan);
    box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
  }

  .cell.o {
    color: var(--neon-magenta);
    text-shadow: 0 0 10px rgba(255, 0, 255, 0.8), 0 0 20px rgba(255, 0, 255, 0.4);
    border-color: var(--neon-magenta);
    box-shadow: 0 0 10px rgba(255, 0, 255, 0.3);
  }

  .cell.win {
    background: rgba(0, 255, 0, 0.15);
    border-color: var(--neon-green);
    color: var(--neon-green) !important;
    text-shadow: 0 0 15px rgba(0, 255, 0, 1), 0 0 30px rgba(0, 255, 0, 0.6) !important;
    box-shadow: var(--shadow-green);
    animation: pulse 0.8s ease infinite;
  }

  .cell .mark {
    display: inline-block;
    animation: pop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  @keyframes pop {
    0% { transform: scale(0.3); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
  }

  .controls {
    display: flex;
    gap: 12px;
    width: 100%;
  }

  .btn {
    flex: 1;
    padding: 14px 20px;
    border: 2px solid var(--neon-cyan);
    border-radius: 10px;
    background: transparent;
    color: var(--neon-cyan);
    font-size: 1rem;
    font-weight: 600;
    letter-spacing: 0.5px;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
  }

  .btn:hover {
    background: rgba(0, 255, 255, 0.1);
    box-shadow: var(--shadow-cyan);
    transform: translateY(-2px);
  }

  .btn:active {
    transform: translateY(0) scale(0.98);
  }

  footer {
    margin-top: 8px;
    color: var(--text-muted);
    font-size: 0.8rem;
    text-align: center;
  }

  @media (max-width: 360px) {
    .board { gap: 8px; padding: 10px; }
    .status { font-size: 0.95rem; padding: 12px 14px; }
    .mode-btn { font-size: 0.85rem; padding: 10px 12px; }
  }
</style>
</head>
<body>
  <div class="app">
    <header>
      <h1>NEON TIC-TAC-TOE</h1>
      <p class="subtitle">Choose your mode and play!</p>
    </header>

    <div class="mode-selector">
      <button id="mode-pvp" class="mode-btn">VS Player</button>
      <button id="mode-ai" class="mode-btn active">VS AI</button>
    </div>

    <div id="status" class="status">Your turn</div>

    <div id="board" class="board" aria-label="Tic-Tac-Toe board"></div>

    <div class="controls">
      <button id="restart" class="btn">Restart</button>
    </div>

    <footer>Tap a square to play. Good luck!</footer>
  </div>

<script>
(function () {
  const HUMAN = 'X';
  const AI = 'O';
  const WIN_LINES = [
    [0, 1, 2], [3, 4, 5], [6, 7, 8], // rows
    [0, 3, 6], [1, 4, 7], [2, 5, 8], // cols
    [0, 4, 8], [2, 4, 6]             // diagonals
  ];

  const boardEl = document.getElementById('board');
  const statusEl = document.getElementById('status');
  const restartBtn = document.getElementById('restart');
  const modePvpBtn = document.getElementById('mode-pvp');
  const modeAiBtn = document.getElementById('mode-ai');

  let board;
  let gameOver;
  let aiThinking;
  let currentPlayer;
  let mode; // 'pvp' or 'ai'

  function init() {
    board = Array(9).fill('');
    gameOver = false;
    aiThinking = false;
    currentPlayer = HUMAN;
    renderBoard();
    updateStatus();
  }

  function setMode(newMode) {
    mode = newMode;
    modePvpBtn.classList.toggle('active', mode === 'pvp');
    modeAiBtn.classList.toggle('active', mode === 'ai');
    init();
  }

  function renderBoard() {
    boardEl.innerHTML = '';
    for (let i = 0; i < 9; i++) {
      const cell = document.createElement('button');
      cell.className = 'cell';
      cell.dataset.index = i;
      cell.setAttribute('aria-label', `Cell ${i + 1}, empty`);
      cell.addEventListener('click', onCellClick);
      boardEl.appendChild(cell);
    }
  }

  function onCellClick(e) {
    if (gameOver || aiThinking) return;
    const idx = Number(e.currentTarget.dataset.index);
    if (board[idx] !== '') return;

    makeMove(idx, currentPlayer);
    const result = checkResult(board);
    if (result) {
      endGame(result);
      return;
    }

    if (mode === 'ai' && currentPlayer === HUMAN) {
      aiThinking = true;
      updateStatus();
      setTimeout(aiMove, 350);
    } else {
      currentPlayer = currentPlayer === HUMAN ? AI : HUMAN;
      updateStatus();
    }
  }

  function makeMove(idx, player) {
    board[idx] = player;
    const cell = boardEl.children[idx];
    cell.disabled = true;
    cell.classList.add(player === HUMAN ? 'x' : 'o');
    cell.setAttribute('aria-label', `Cell ${idx + 1}, ${player}`);
    const span = document.createElement('span');
    span.className = 'mark';
    span.textContent = player;
    cell.appendChild(span);
  }

  function aiMove() {
    const move = chooseAiMove(board);
    makeMove(move, AI);
    aiThinking = false;
    const result = checkResult(board);
    if (result) {
      endGame(result);
      return;
    }
    currentPlayer = HUMAN;
    updateStatus();
  }

  function chooseAiMove(b) {
    const empty = b.map((v, i) => v === '' ? i : -1).filter(i => i !== -1);

    // 1. Win
    for (const i of empty) {
      b[i] = AI;
      if (findWinner(b) === AI) { b[i] = ''; return i; }
      b[i] = '';
    }
    // 2. Block
    for (const i of empty) {
      b[i] = HUMAN;
      if (findWinner(b) === HUMAN) { b[i] = ''; return i; }
      b[i] = '';
    }
    // 3. Center
    if (b[4] === '') return 4;
    // 4. Corner
    const corners = [0, 2, 6, 8].filter(i => b[i] === '');
    if (corners.length) return corners[Math.floor(Math.random() * corners.length)];
    // 5. Any
    return empty[Math.floor(Math.random() * empty.length)];
  }

  function findWinner(b) {
    for (const [a, c, d] of WIN_LINES) {
      if (b[a] && b[a] === b[c] && b[a] === b[d]) return b[a];
    }
    return null;
  }

  function findWinningLine(b) {
    for (const line of WIN_LINES) {
      const [a, c, d] = line;
      if (b[a] && b[a] === b[c] && b[a] === b[d]) return line;
    }
    return null;
  }

  function checkResult(b) {
    const winner = findWinner(b);
    if (winner) return { type: 'winner', player: winner, line: findWinningLine(b) };
    if (b.every(v => v !== '')) return { type: 'draw' };
    return null;
  }

  function endGame(result) {
    gameOver = true;
    for (const cell of boardEl.children) cell.disabled = true;

    if (result.type === 'winner') {
      result.line.forEach(i => boardEl.children[i].classList.add('win'));
      if (mode === 'ai') {
        if (result.player === HUMAN) {
          setStatus('You win! 🎉', 'win');
        } else {
          setStatus('AI wins. Try again!', 'lose');
        }
      } else {
        setStatus(`Player ${result.player} wins! 🎉`, 'win');
      }
    } else {
      setStatus("It's a draw!", 'draw');
    }
  }

  function updateStatus() {
    if (gameOver) return;
    if (aiThinking) {
      setStatus('AI is thinking…', '');
    } else if (mode === 'ai') {
      setStatus('Your turn', '');
    } else {
      setStatus(`Player ${currentPlayer}'s turn`, '');
    }
  }

  function setStatus(text, variant) {
    statusEl.textContent = text;
    statusEl.classList.remove('win', 'lose', 'draw');
    if (variant) statusEl.classList.add(variant);
  }

  restartBtn.addEventListener('click', init);
  modePvpBtn.addEventListener('click', () => setMode('pvp'));
  modeAiBtn.addEventListener('click', () => setMode('ai'));

  mode = 'ai';
  init();
})();
</script>
</body>
</html>
