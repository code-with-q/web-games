<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Memory Match</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg-0: #0b0d14;
    --bg-1: #12151f;
    --bg-2: #1a1f2e;
    --accent: #7c5cff;
    --accent-2: #22d3ee;
    --success: #22c55e;
    --text: #e6e8ef;
    --muted: #8b92a7;
    --card-back-1: #2a2f45;
    --card-back-2: #1b1f30;
    --radius: 14px;
  }

  html, body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text);
    background: radial-gradient(1200px 800px at 20% -10%, #1a1f35 0%, transparent 60%),
                radial-gradient(1000px 700px at 110% 10%, #1a2a35 0%, transparent 55%),
                linear-gradient(180deg, var(--bg-0), var(--bg-1));
    overflow-x: hidden;
  }

  .app {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 16px 40px;
    max-width: 640px;
    margin: 0 auto;
  }

  header {
    width: 100%;
    text-align: center;
    margin-bottom: 14px;
  }

  h1 {
    font-size: clamp(1.5rem, 5vw, 2rem);
    letter-spacing: 0.5px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    font-weight: 800;
  }

  .level-badge {
    display: inline-block;
    margin-top: 6px;
    padding: 4px 12px;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--accent-2);
    background: rgba(34, 211, 238, 0.08);
    border: 1px solid rgba(34, 211, 238, 0.25);
    border-radius: 999px;
  }

  .stats {
    width: 100%;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 16px;
    padding: 10px;
    background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.02));
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: var(--radius);
    backdrop-filter: blur(6px);
  }

  .stat {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 4px 2px;
  }

  .stat-label {
    font-size: 0.62rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
  }

  .stat-value {
    font-size: 1.15rem;
    font-weight: 700;
    margin-top: 2px;
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }

  .stat-value.timer { color: var(--accent-2); }

  .btn {
    appearance: none;
    border: none;
    cursor: pointer;
    padding: 8px 14px;
    border-radius: 10px;
    font-size: 0.85rem;
    font-weight: 600;
    color: #fff;
    background: linear-gradient(135deg, var(--accent), #5b3dff);
    box-shadow: 0 6px 18px rgba(124, 92, 255, 0.35);
    transition: transform 0.15s ease, filter 0.15s ease;
    touch-action: manipulation;
  }
  .btn:active { transform: translateY(1px) scale(0.98); }
  .btn:hover { filter: brightness(1.08); }
  .btn.ghost {
    background: transparent;
    border: 1px solid rgba(255,255,255,0.15);
    box-shadow: none;
    color: var(--text);
  }

  .board {
    width: 100%;
    display: grid;
    gap: 8px;
    perspective: 1200px;
  }

  .card {
    aspect-ratio: 1 / 1;
    position: relative;
    cursor: pointer;
    transform-style: preserve-3d;
    transition: transform 0.55s cubic-bezier(0.22, 0.61, 0.36, 1);
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
  }

  .card .face {
    position: absolute;
    inset: 0;
    border-radius: var(--radius);
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 6px 18px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.06);
  }

  .card .back {
    background: linear-gradient(135deg, var(--card-back-1), var(--card-back-2));
    border: 1px solid rgba(255,255,255,0.08);
    overflow: hidden;
  }
  .card .back::before {
    content: "";
    position: absolute;
    inset: 8px;
    border-radius: 10px;
    border: 1px dashed rgba(255,255,255,0.12);
  }
  .card .back::after {
    content: "?";
    font-size: 1.4rem;
    font-weight: 700;
    color: rgba(255,255,255,0.25);
  }

  .card .front {
    background: linear-gradient(180deg, #ffffff, #e9ecf5);
    color: #1a1f30;
    transform: rotateY(180deg);
    border: 1px solid rgba(0,0,0,0.05);
    font-size: clamp(1.4rem, 6vw, 2.4rem);
  }

  .card.flipped { transform: rotateY(180deg); }

  .card.matched .front {
    background: linear-gradient(180deg, #e6fff1, #c6f6d5);
    box-shadow: 0 0 0 2px rgba(34, 197, 94, 0.5), 0 6px 18px rgba(34, 197, 94, 0.25);
  }

  .card.matched { animation: pop 0.4s ease; }

  @keyframes pop {
    0% { transform: rotateY(180deg) scale(1); }
    50% { transform: rotateY(180deg) scale(1.08); }
    100% { transform: rotateY(180deg) scale(1); }
  }

  .win-overlay {
    position: fixed;
    inset: 0;
    background: rgba(6, 8, 14, 0.78);
    backdrop-filter: blur(8px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 10;
    padding: 20px;
    animation: fadeIn 0.3s ease;
  }
  .win-overlay.show { display: flex; }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .win-card {
    background: linear-gradient(180deg, #1a1f30, #12151f);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 20px;
    padding: 28px 24px;
    text-align: center;
    max-width: 360px;
    width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    animation: slideUp 0.4s cubic-bezier(0.22, 0.61, 0.36, 1);
  }

  @keyframes slideUp {
    from { transform: translateY(20px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  .win-card h2 {
    font-size: 1.5rem;
    margin-bottom: 4px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .win-card .level-line {
    color: var(--muted);
    font-size: 0.85rem;
    margin-bottom: 14px;
  }

  .win-stats {
    display: flex;
    justify-content: space-around;
    margin: 14px 0 18px;
    padding: 12px;
    background: rgba(255,255,255,0.03);
    border-radius: 12px;
  }

  .win-stat { text-align: center; }
  .win-stat .v { font-size: 1.6rem; font-weight: 800; color: var(--text); }
  .win-stat .l { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-top: 2px; }

  .win-actions {
    display: flex;
    gap: 10px;
    justify-content: center;
  }

  @media (max-width: 380px) {
    .board { gap: 6px; }
    .stats { padding: 8px; gap: 6px; }
    .stat-value { font-size: 1rem; }
  }
</style>
</head>
<body>
  <div class="app">
    <header>
      <h1>Memory Match</h1>
      <div class="level-badge" id="levelBadge">Level 1</div>
    </header>

    <div class="stats">
      <div class="stat">
        <div class="stat-label">Time</div>
        <div class="stat-value timer" id="timer">0:00</div>
      </div>
      <div class="stat">
        <div class="stat-label">Moves</div>
        <div class="stat-value" id="moves">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">Matches</div>
        <div class="stat-value"><span id="matches">0</span>/<span id="totalPairs">8</span></div>
      </div>
      <div class="stat">
        <button class="btn" id="restart">Restart</button>
      </div>
    </div>

    <div class="board" id="board"></div>
  </div>

  <div class="win-overlay" id="winOverlay">
    <div class="win-card">
      <h2 id="winTitle">Level Complete! 🎉</h2>
      <div class="level-line" id="winLevel">Level 1 cleared</div>
      <div class="win-stats">
        <div class="win-stat">
          <div class="v" id="finalTime">0:00</div>
          <div class="l">Time</div>
        </div>
        <div class="win-stat">
          <div class="v" id="finalMoves">0</div>
          <div class="l">Moves</div>
        </div>
      </div>
      <div class="win-actions">
        <button class="btn ghost" id="resetLevel">Level 1</button>
        <button class="btn" id="nextLevel">Next Level →</button>
      </div>
    </div>
  </div>

<script>
(() => {
  const SYMBOLS = [
    '🎮','🎲','🎯','🎪','🎨','🎭','🎬','🎤',
    '🎸','🎺','🎻','🥁','🎹','🎧','🎼','🎷',
    '🎳','🏀','🏈','⚽','🎾','🏐','🎱','🏓',
    '🏸','🥊','🎿','🏂','🚀','🛸','🌈','⭐'
  ];

  // Difficulty scaling: each level defines grid layout + pair count
  const LEVELS = [
    { cols: 4, rows: 4, pairs: 8  }, // 16 cards
    { cols: 4, rows: 5, pairs: 10 }, // 20 cards
    { cols: 4, rows: 6, pairs: 12 }, // 24 cards
    { cols: 6, rows: 6, pairs: 18 }, // 36 cards
    { cols: 6, rows: 8, pairs: 24 }  // 48 cards (max)
  ];

  const board = document.getElementById('board');
  const movesEl = document.getElementById('moves');
  const matchesEl = document.getElementById('matches');
  const totalPairsEl = document.getElementById('totalPairs');
  const timerEl = document.getElementById('timer');
  const levelBadge = document.getElementById('levelBadge');
  const restartBtn = document.getElementById('restart');

  const winOverlay = document.getElementById('winOverlay');
  const winTitle = document.getElementById('winTitle');
  const winLevel = document.getElementById('winLevel');
  const finalTimeEl = document.getElementById('finalTime');
  const finalMovesEl = document.getElementById('finalMoves');
  const nextLevelBtn = document.getElementById('nextLevel');
  const resetLevelBtn = document.getElementById('resetLevel');

  let level = 1;
  let firstCard = null;
  let secondCard = null;
  let lockBoard = false;
  let moves = 0;
  let matches = 0;
  let totalPairs = 0;

  // Timer state
  let timerInterval = null;
  let startTime = 0;
  let elapsed = 0;
  let timerStarted = false;

  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function formatTime(s) {
    const m = Math.floor(s / 60);
    const sec = s % 60;
    return `${m}:${sec.toString().padStart(2, '0')}`;
  }

  function startTimer() {
    if (timerStarted) return;
    timerStarted = true;
    startTime = Date.now();
    timerInterval = setInterval(() => {
      elapsed = Math.floor((Date.now() - startTime) / 1000);
      timerEl.textContent = formatTime(elapsed);
    }, 500);
  }

  function stopTimer() {
    clearInterval(timerInterval);
    timerInterval = null;
  }

  function resetTimer() {
    stopTimer();
    timerStarted = false;
    elapsed = 0;
    timerEl.textContent = '0:00';
  }

  function getLevelConfig(lvl) {
    const idx = Math.min(lvl - 1, LEVELS.length - 1);
    return LEVELS[idx];
  }

  function createCard(symbol) {
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.symbol = symbol;

    const back = document.createElement('div');
    back.className = 'face back';

    const front = document.createElement('div');
    front.className = 'face front';
    front.textContent = symbol;

    card.appendChild(back);
    card.appendChild(front);
    card.addEventListener('click', onCardClick);
    return card;
  }

  function onCardClick(e) {
    const card = e.currentTarget;
    if (lockBoard) return;
    if (card.classList.contains('flipped')) return;
    if (card.classList.contains('matched')) return;

    // Start timer on first card flip of the game
    if (!timerStarted) startTimer();

    card.classList.add('flipped');

    if (!firstCard) {
      firstCard = card;
      return;
    }

    secondCard = card;
    moves++;
    movesEl.textContent = moves;
    checkMatch();
  }

  function checkMatch() {
    const isMatch = firstCard.dataset.symbol === secondCard.dataset.symbol;

    if (isMatch) {
      firstCard.classList.add('matched');
      secondCard.classList.add('matched');
      matches++;
      matchesEl.textContent = matches;
      resetTurn();

      if (matches === totalPairs) {
        stopTimer();
        setTimeout(showWin, 600);
      }
    } else {
      lockBoard = true;
      setTimeout(() => {
        firstCard.classList.remove('flipped');
        secondCard.classList.remove('flipped');
        resetTurn();
      }, 900);
    }
  }

  function resetTurn() {
    firstCard = null;
    secondCard = null;
    lockBoard = false;
  }

  function showWin() {
    finalTimeEl.textContent = formatTime(elapsed);
    finalMovesEl.textContent = moves;
    winLevel.textContent = `Level ${level} cleared`;

    const maxedOut = level >= LEVELS.length;
    if (maxedOut) {
      winTitle.textContent = 'All Levels Complete! 🏆';
      nextLevelBtn.textContent = 'Play Again';
      nextLevelBtn.dataset.action = 'restart';
    } else {
      winTitle.textContent = 'Level Complete! 🎉';
      nextLevelBtn.textContent = `Next Level →`;
      nextLevelBtn.dataset.action = 'next';
    }

    winOverlay.classList.add('show');
  }

  function hideWin() {
    winOverlay.classList.remove('show');
  }

  function initGame(lvl, keepLevel = false) {
    if (!keepLevel) level = lvl;

    const config = getLevelConfig(level);
    totalPairs = config.pairs;

    // Reset game state
    board.innerHTML = '';
    firstCard = null;
    secondCard = null;
    lockBoard = false;
    moves = 0;
    matches = 0;
    movesEl.textContent = '0';
    matchesEl.textContent = '0';
    totalPairsEl.textContent = totalPairs;
    levelBadge.textContent = `Level ${level}`;

    // Configure grid
    board.style.gridTemplateColumns = `repeat(${config.cols}, 1fr)`;

    // Build deck
    const chosen = shuffle([...SYMBOLS]).slice(0, totalPairs);
    const deck = shuffle([...chosen, ...chosen]);
    deck.forEach(sym => board.appendChild(createCard(sym)));

    resetTimer();
  }

  // Event handlers
  restartBtn.addEventListener('click', () => initGame(level, true));

  nextLevelBtn.addEventListener('click', () => {
    hideWin();
    if (nextLevelBtn.dataset.action === 'restart') {
      initGame(1);
    } else {
      initGame(level + 1);
    }
  });

  resetLevelBtn.addEventListener('click', () => {
    hideWin();
    initGame(1);
  });

  // Start
  initGame(1);
})();
</script>
</body>
</html>
